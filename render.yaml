services:
  - type: web
    name: epixel
    region: omaha
    plan: free
    env: node
    buildCommand: npm install && npm run migrate-png || echo "migrate skipped (non-fatal)"
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        fromSecret: SUPABASE_URL
      - key: SUPABASE_ANON_KEY
        fromSecret: SUPABASE_ANON_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromSecret: SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_DB_PASSWORD
        fromSecret: SUPABASE_DB_PASSWORD
      - key: PORT
        value: 10000
